<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando... | Carplus Pneus</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 64px;
      margin: 0 0 10px 0;
      color: #f49e1a;
      background: linear-gradient(135deg, #f49e1a 0%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 18px;
      margin: 0 0 24px 0;
      color: #4b5563;
      font-weight: 500;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #f49e1a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    .btn {
      display: inline-block;
      background-color: #f49e1a;
      color: #0c0a09;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #e08a0d;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Universal URL mapper inside 404 fallback
    (function() {
      var path = window.location.pathname.toLowerCase().trim();
      var target = "/";
      
      if (path.indexOf("fale-conosco") !== -1 || path.indexOf("faleconosco") !== -1 || path.indexOf("contato") !== -1) {
        target = "/contato";
      } else if (path.indexOf("quem-somos") !== -1 || path.indexOf("quemsomos") !== -1) {
        target = "/quem-somos";
      } else if (path.indexOf("politica-privacidade") !== -1 || path.indexOf("privacidade") !== -1) {
        target = "/politica-privacidades";
      } else if (path.indexOf("politica-devolucao") !== -1 || path.indexOf("devolucao") !== -1 || path.indexOf("garantia") !== -1) {
        target = "/politica-devolucao";
      } else if (path.indexOf("mapa-do-site") !== -1 || path.indexOf("mapadosite") !== -1) {
        target = "/mapa-do-site";
      }
      
      // Redirect instantly using replace to avoid breaking the Back button history
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>404</h1>
    <p>Redirecionando você para a página correta...</p>
    <a href="/" class="btn">Ir para o Início</a>
  </div>
</body>
</html>
